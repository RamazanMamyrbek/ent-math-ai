name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: entmath_user
          POSTGRES_PASSWORD: entmath_password
          POSTGRES_DB: entmath_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Start Backend
      run: |
        cd backend
        ./mvnw spring-boot:run &
        # Wait for backend to be ready
        timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done' || false
        
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend
      
    - name: Type Check
      run: npm run typecheck
      working-directory: ./frontend
      
    - name: Lint
      run: npm run lint
      working-directory: ./frontend
      
    - name: Build
      run: npm run build
      working-directory: ./frontend
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      working-directory: ./frontend
      
    - name: Run Playwright tests
      run: npm run test:e2e
      working-directory: ./frontend
